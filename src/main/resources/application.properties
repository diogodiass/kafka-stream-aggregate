# Configurações do Kafka
kafka.bootstrap.servers=localhost:9092


# Configurações do Kafka Streams
quarkus.kafka-streams.application-id=my-streams-app
quarkus.kafka-streams.topics=posting-topic,user-topic
quarkus.kafka-streams.cache-max-bytes-buffering=10485760
quarkus.kafka-streams.commit-interval=1000

mp.messaging.incoming.my-output-topic.topic=posting-with-user-topic
mp.messaging.incoming.my-output-topic.group.id=my-output-group